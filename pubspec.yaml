name: dchakra
description: "Chakra yoga and meditation practice app."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.8.1

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  flutter_tts: ^4.0.2
  audioplayers: ^6.0.0
  flutter_svg: ^2.0.9
  lottie: ^3.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/images/Muladhara.svg
    - assets/images/Ajna.svg
    - assets/images/Anahata.svg
    - assets/images/Manipura.svg
    - assets/images/Sahasrara.svg
    - assets/images/Swadhisthana.svg
    - assets/images/Vishuddha.svg
    - assets/data/
    - assets/muladhara/
    - assets/swadhisthana/
    - assets/manipura/
    - assets/anahata/
    - assets/vishuddha/
    - assets/ajna/
    - assets/sahasrara/
    - assets/mantra/
    - assets/lottie/

  # ── Display font: Cormorant (variable font — one file covers all weights) ──
  # Body/label text intentionally stays on the platform font so Hindi &
  # Japanese always render correctly; only headings/branding use Cormorant.
  # Requires assets/fonts/Cormorant-VariableFont_wght.ttf to be present.
  fonts:
    - family: 'Cormorant'
      fonts:
        - asset: assets/fonts/Cormorant-VariableFont_wght.ttf
